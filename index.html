    // ─── Audio ──────────────────────────────────────────────────────────────────
    let audioCtx = null;
    let windGainNode = null;
    let audioEnabled = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Create wind sound buffer
      const bufferSize = 4 * audioCtx.sampleRate;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.Q.value = 1.5;

      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.04;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 150;

      lfo.connect(lfoGain);
      lfoGain.connect(windFilter.frequency);
      windFilter.frequency.value = 350;

      windGainNode = audioCtx.createGain();
      windGainNode.gain.value = 0.0;

      whiteNoise.connect(windFilter);
      windFilter.connect(windGainNode);
      windGainNode.connect(audioCtx.destination);

      lfo.start();
      whiteNoise.start();
    }

    function toggleAudio() {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      audioEnabled = !audioEnabled;
      const audioIcon = document.getElementById('audio-icon');

      if (audioEnabled) {
        audioIcon.textContent = '🔊';
        windGainNode.gain.setTargetAtTime(0.08, audioCtx.currentTime, 1.5);
      } else {
        audioIcon.textContent = '🔇';
        windGainNode.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.8);
      }
    }

    function playChime(freq) {
      if (!audioCtx || !audioEnabled || audioCtx.state === 'suspended') return;

      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc1.type = 'sine';
      osc2.type = 'sine';

      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 1.25, now); // major third

      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.04, now + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);

      const delay = audioCtx.createDelay(1.0);
      delay.delayTime.value = 0.35;
      const feedback = audioCtx.createGain();
      feedback.gain.value = 0.35;

      osc1.connect(gainNode);
      osc2.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      gainNode.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      feedback.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 2.5);
      osc2.stop(now + 2.5);
    }

    // ─── World Helpers ──────────────────────────────────────────────────────────
    function getTerrainHeight(x, z) {
      // Layered sine/cosine functions to create organic hills and valleys
      return Math.sin(x * 0.1) * 1.2 + Math.cos(z * 0.12) * 0.8 + Math.sin((x + z) * 0.05) * 1.5;
    }

    // ─── World ──────────────────────────────────────────────────────────────────
    function buildWorld() {
      clock = new THREE.Clock();

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040a07); // deep dark forest jade
      scene.fog = new THREE.FogExp2(0x06140e, 0.018); // thicker mysterious mist

      // Camera

      camera.position.set(-30, 5, 10);

      // Lights

      scene.add(new THREE.HemisphereLight(0x133824, 0x050f0a, 0.55));

      const sun = new THREE.DirectionalLight(0xe4c275, 1.4); // soft golden moonlight/sun shafts
      sun.position.set(35, 50, 15);
      sun.castShadow = true;
      sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
      sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
      sun.shadow.camera.far = 250;
      sun.shadow.mapSize.set(2048, 2048);
      scene.add(sun);

      buildGround();
      buildPath();
      buildWater();
      buildGodRays();
      buildSpores();
      buildTrees();
      buildClouds();
      buildBirds();
      buildFireflies();
      buildCharacter();
      buildZones();
      buildSpaceSky();
      setupEvents();

    // ─── Space Sky elements ──────────────────────────────────────────────────────
    let earthMesh, moonMesh, marsMesh, saturnGroup, galaxyParticles;

    function createEarthTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Blue ocean base
      ctx.fillStyle = '#0d47a1';
      ctx.fillRect(0, 0, 512, 256);

      // Draw green continents
      ctx.fillStyle = '#1b5e20';
      // South America
      ctx.beginPath(); ctx.arc(150, 160, 42, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(170, 185, 28, 0, Math.PI * 2); ctx.fill();
      // North America
      ctx.beginPath(); ctx.arc(130, 85, 52, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(90, 75, 38, 0, Math.PI * 2); ctx.fill();
      // Africa
      ctx.fillStyle = '#33691e';
      ctx.beginPath(); ctx.arc(280, 145, 48, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(300, 180, 28, 0, Math.PI * 2); ctx.fill();
      // Eurasia
      ctx.fillStyle = '#1b5e20';
      ctx.beginPath(); ctx.arc(320, 75, 62, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(420, 65, 58, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(380, 105, 42, 0, Math.PI * 2); ctx.fill();
      // Australia
      ctx.beginPath(); ctx.arc(440, 185, 28, 0, Math.PI * 2); ctx.fill();

      // White cloud overlays
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath(); ctx.arc(120, 90, 60, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(320, 80, 80, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(230, 160, 45, 0, Math.PI * 2); ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    function buildSpaceSky() {
      // 1. Stars (upper hemisphere)
      const count = 1600;
      const starGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const colors = [];

      for (let i = 0; i < count; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);

        const r = 260 + Math.random() * 50;
        pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = Math.abs(r * Math.sin(phi) * Math.sin(theta)) + 5; // keep above ground
        pos[i * 3 + 2] = r * Math.cos(phi);

        const rand = Math.random();
        if (rand < 0.2) {
          colors.push(0.85, 0.9, 1.0); // blue-white
        } else if (rand < 0.35) {
          colors.push(1.0, 0.95, 0.85); // warm-white
        } else {
          colors.push(1.0, 1.0, 1.0); // white
        }
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      starGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const starMat = new THREE.PointsMaterial({
        size: 0.55,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        sizeAttenuation: true,
        fog: false // bypass fog!
      });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      // 2. Earth
      const earthGeo = new THREE.SphereGeometry(15, 28, 28);
      const earthMat = new THREE.MeshBasicMaterial({
        map: createEarthTexture(),
        fog: false
      });
      earthMesh = new THREE.Mesh(earthGeo, earthMat);
      earthMesh.position.set(-65, 80, -210);
      scene.add(earthMesh);

      // 3. Moon (Orbiting Earth)
      const moonGeo = new THREE.SphereGeometry(3.6, 16, 16);
      const mPos = moonGeo.attributes.position;
      for (let i = 0; i < mPos.count; i++) {
        const nx = mPos.getX(i);
        const ny = mPos.getY(i);
        const nz = mPos.getZ(i);
        const factor = 1.0 + Math.sin(nx * 2.5) * Math.cos(ny * 2.5) * 0.04;
        mPos.setX(i, nx * factor);
        mPos.setY(i, ny * factor);
        mPos.setZ(i, nz * factor);
      }
      moonGeo.computeVertexNormals();
      const moonMat = new THREE.MeshStandardMaterial({
        color: 0x909090,
        roughness: 0.95,
        metalness: 0.05,
        fog: false
      });
      moonMesh = new THREE.Mesh(moonGeo, moonMat);
      moonMesh.position.set(-35, 95, -170);
      scene.add(moonMesh);

      // 4. Mars
      const marsGeo = new THREE.SphereGeometry(7.0, 16, 16);
      const marsMat = new THREE.MeshStandardMaterial({
        color: 0xc1440e,
        roughness: 0.85,
        metalness: 0.15,
        fog: false
      });
      marsMesh = new THREE.Mesh(marsGeo, marsMat);
      marsMesh.position.set(80, 90, -190);
      scene.add(marsMesh);

      // 5. Saturn & Rings
      saturnGroup = new THREE.Group();
      saturnGroup.position.set(-130, 95, -150);

      const saturnGeo = new THREE.SphereGeometry(9.5, 20, 20);
      const saturnMat = new THREE.MeshStandardMaterial({
        color: 0xe2c792,
        roughness: 0.75,
        metalness: 0.25,
        fog: false
      });
      const saturnPlanet = new THREE.Mesh(saturnGeo, saturnMat);
      saturnGroup.add(saturnPlanet);

      const ringGeo = new THREE.RingGeometry(11.5, 21.0, 36);
      ringGeo.rotateX(Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xc29e6b,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.88,
        fog: false
      });
      const rings = new THREE.Mesh(ringGeo, ringMat);
      saturnGroup.add(rings);

      scene.add(saturnGroup);

      // 6. Glowing Spiral Galaxy
      const galCount = 1100;
      const galGeo = new THREE.BufferGeometry();
      const galPos = new Float32Array(galCount * 3);
      const galColors = [];
      const arms = 2;
      const colCore = new THREE.Color(0xffe6cc);
      const colArm = new THREE.Color(0xd19fe8);

      for (let i = 0; i < galCount; i++) {
        const r = Math.random() * 32;
        const armIdx = i % arms;
        const theta = (armIdx / arms) * Math.PI * 2 + (r * 0.16) + (Math.random() - 0.5) * 0.38;

        const x = r * Math.sin(theta);
        const z = r * Math.cos(theta);
        const y = (Math.random() - 0.5) * 2.2 * (1.0 - r / 32.0);

        galPos[i * 3] = x;
        galPos[i * 3 + 1] = y;
        galPos[i * 3 + 2] = z;

        const mix = colCore.clone().lerp(colArm, r / 32.0);
        galColors.push(mix.r, mix.g, mix.b);
      }
      galGeo.setAttribute('position', new THREE.BufferAttribute(galPos, 3));
      galGeo.setAttribute('color', new THREE.Float32BufferAttribute(galColors, 3));

      const galMat = new THREE.PointsMaterial({
        size: 0.65,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false
      });
      galaxyParticles = new THREE.Points(galGeo, galMat);
      galaxyParticles.position.set(120, 105, -140);
      galaxyParticles.rotation.x = 0.55;
      scene.add(galaxyParticles);
    }

    function buildGround() {
      const geo = new THREE.PlaneGeometry(220, 220, 64, 64);
      const pos = geo.attributes.position;
      const colors = [];

      const colBase = new THREE.Color(0x05120a); // dark damp peat
      const colGrass = new THREE.Color(0x0f2f18); // forest moss
      const colBright = new THREE.Color(0x275a32); // glowing patch

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const y = getTerrainHeight(x, z);
        pos.setY(i, y);

        // Vertex coloring based on height and noise
        const noise = Math.sin(x * 0.5) * Math.cos(z * 0.5) * 0.2;
        const h = (y + 3.5) / 7.0 + noise; // normalized height roughly
        const finalColor = colBase.clone().lerp(colGrass, Math.max(0, Math.min(1, h))).lerp(colBright, Math.max(0, Math.min(1, h * h)));
        colors.push(finalColor.r, finalColor.g, finalColor.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.95,
        metalness: 0.05
      }));
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    function buildPath() {
      // Organic winding path of stone pavers
      const mat = new THREE.MeshStandardMaterial({ color: 0x3d3f3c, roughness: 0.9, metalness: 0.1 });
      for (let x = -55; x < 60; x += 3.5) {
        const zOffset = Math.sin(x * 0.1) * 2.0; // Winding path curve
        const y = getTerrainHeight(x, zOffset) + 0.03;

        const size = 1.3 + Math.random() * 0.6;
        const stoneGeo = new THREE.BoxGeometry(size, 0.08, size * (0.8 + Math.random() * 0.4));

        // Jitter vertex positions for rocky feel
        const pos = stoneGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 0.06);
          pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * 0.06);
        }
        stoneGeo.computeVertexNormals();

        const stone = new THREE.Mesh(stoneGeo, mat);
        stone.position.set(x, y, zOffset + (Math.random() - 0.5) * 0.7);
        stone.rotation.y = Math.random() * Math.PI;
        stone.rotation.x = (Math.random() - 0.5) * 0.1;
        stone.rotation.z = (Math.random() - 0.5) * 0.1;
        stone.receiveShadow = true;
        scene.add(stone);
      }
    }

    function buildWater() {

    function buildGodRays() {

    let sporeParticles;
    const sporeCount = 650;
    const sporeSpeeds = [];

    function buildSpores() {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(sporeCount * 3);
      for (let i = 0; i < sporeCount; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 150;
        pos[i * 3 + 1] = Math.random() * 16;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 75;

        sporeSpeeds.push({
          x: (Math.random() - 0.5) * 0.45,
          y: 0.16 + Math.random() * 0.32,
          z: (Math.random() - 0.5) * 0.45,
          phase: Math.random() * Math.PI * 2
        });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      const mat = new THREE.PointsMaterial({
        color: 0xe4c275,
        size: 0.12,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      sporeParticles = new THREE.Points(geo, mat);
      scene.add(sporeParticles);
    }

    function animateSpores(dt, t) {
      if (!sporeParticles) return;
      const pos = sporeParticles.geometry.attributes.position.array;
      for (let i = 0; i < sporeCount; i++) {
        const speed = sporeSpeeds[i];
        pos[i * 3 + 1] -= speed.y * dt;
        if (pos[i * 3 + 1] < 0) {
          pos[i * 3 + 1] = 16;
          pos[i * 3] = (Math.random() - 0.5) * 150;
          pos[i * 3 + 2] = (Math.random() - 0.5) * 75;
        }
        pos[i * 3] += Math.sin(t * 0.8 + speed.phase) * 0.15 * dt + speed.x * dt;
        pos[i * 3 + 2] += Math.cos(t * 0.6 + speed.phase) * 0.15 * dt + speed.z * dt;
      }
      sporeParticles.geometry.attributes.position.needsUpdate = true;
    }

    function buildAncientOak(x, z, scale = 1.0) {
      const y = getTerrainHeight(x, z);
      const group = new THREE.Group();
      group.position.set(x, y - 0.15, z);

      const trunkH = (7 + Math.random() * 3.5) * scale;
      const trunkGeo = new THREE.CylinderGeometry(0.24 * scale, 0.78 * scale, trunkH, 8);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x22150a, roughness: 0.98 });

      // Make trunk twisty
      const pos = trunkGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vy = pos.getY(i);
        const offset = Math.sin(vy * 0.5) * 0.28 * scale;
        pos.setX(i, pos.getX(i) + offset);
        pos.setZ(i, pos.getZ(i) + Math.cos(vy * 0.4) * 0.18 * scale);
      }
      trunkGeo.computeVertexNormals();

      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = trunkH / 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      // Branches & Leaves
      const branchMat = new THREE.MeshStandardMaterial({ color: 0x22150a, roughness: 0.98 });
      const numBranches = 3 + Math.floor(Math.random() * 2);
      for (let i = 0; i < numBranches; i++) {
        const bH = (3.2 + Math.random() * 2.2) * scale;
        const bGeo = new THREE.CylinderGeometry(0.12 * scale, 0.24 * scale, bH, 5);
        const bMesh = new THREE.Mesh(bGeo, branchMat);

        const branchAngle = (i / numBranches) * Math.PI * 2 + Math.random() * 0.35;
        const startH = trunkH * (0.4 + Math.random() * 0.38);
        bMesh.position.set(0, startH, 0);
        bMesh.rotation.z = 0.65 + Math.random() * 0.4;
        bMesh.rotation.y = branchAngle;
        bMesh.translateY(bH / 2);
        bMesh.castShadow = true;
        group.add(bMesh);

        // Canopy cluster
        const fSize = (2.2 + Math.random() * 1.3) * scale;
        const fGeo = new THREE.SphereGeometry(fSize, 6, 6);
        const fMat = new THREE.MeshStandardMaterial({
          color: 0x0f2d15 + (Math.random() < 0.5 ? 0x030802 : 0),
          roughness: 0.85
        });
        const foliage = new THREE.Mesh(fGeo, fMat);
        foliage.position.copy(bMesh.position);
        foliage.translateY(bH / 2);
        foliage.scale.set(1.3, 0.75, 1.3); // squashed sphere canopy
        foliage.castShadow = true;
        foliage.name = 'foliage';
        group.add(foliage);
      }

      // Top canopy
      const fGeoTop = new THREE.SphereGeometry(2.8 * scale, 6, 6);
      const fMatTop = new THREE.MeshStandardMaterial({ color: 0x0b2210, roughness: 0.85 });
      const foliageTop = new THREE.Mesh(fGeoTop, fMatTop);
      foliageTop.position.set(0, trunkH, 0);
      foliageTop.scale.set(1.2, 0.75, 1.2);
      foliageTop.castShadow = true;
      foliageTop.name = 'foliage';
      group.add(foliageTop);

      scene.add(group);
    }

    function buildGlowingMushroom(x, z) {
      const y = getTerrainHeight(x, z);
      const group = new THREE.Group();
      group.position.set(x, y, z);

      // Stem
      const stemMat = new THREE.MeshStandardMaterial({ color: 0xdce2dd, roughness: 0.75 });

      stem.position.y = 0.25;
      group.add(stem);

      // Cap

      const capMat = new THREE.MeshStandardMaterial({
        color: mColor,
        emissive: mColor,
        emissiveIntensity: 0.85,
        roughness: 0.15
      });
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), capMat);

      // Light
      const pl = new THREE.PointLight(mColor, 0.9, 3);

      scene.add(group);

    function buildTrees() {
      // Create Ancient Great Oaks
      const spots = [
        [-15, -12], [15, -12], [-22, -18], [22, -18], [-8, 12], [8, 12],
        [-25, 8], [25, 8], [-32, -8], [32, -8], [-5, -20], [5, -20],

    function buildCharacter() {
      character = new THREE.Group();

      // Materials for the detailed spacesuit
      const suitMat = new THREE.MeshStandardMaterial({ color: 0xf3f3f3, roughness: 0.8, metalness: 0.1 }); // White space suit fabric
      const visorMat = new THREE.MeshStandardMaterial({ color: 0xffb300, roughness: 0.08, metalness: 1.0 }); // Gold reflective visor
      const sealMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 }); // Dark joints / seal rings
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2, metalness: 0.8 }); // Silver metal highlights
      const redMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.5 }); // Red warning details / stripes
      const blueMat = new THREE.MeshStandardMaterial({ color: 0x1976d2, roughness: 0.5 }); // Blue mission details / stripes
      const bootMat = new THREE.MeshStandardMaterial({ color: 0x2e2e2e, roughness: 0.7 }); // Dark space boots/gloves

      // Helper helper to add mesh to a parent group
      const createMesh = (geo, mat, px, py, pz, parent, name) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(px, py, pz);
        if (name) m.name = name;
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      };

      // 1. Torso & Life Support System (Backpack)
      const chest = createMesh(new THREE.CylinderGeometry(0.24, 0.20, 0.56, 10), suitMat, 0, 0.90, 0, character, 'torso');

      // Create texture for Prameesh name tag on the chest
      const nameCanvas = document.createElement('canvas');
      nameCanvas.width = 256;
      nameCanvas.height = 64;
      const nameCtx = nameCanvas.getContext('2d');
      // Dark slate/charcoal background
      nameCtx.fillStyle = '#08140e';
      nameCtx.fillRect(0, 0, 256, 64);
      // Sleek gold border
      nameCtx.strokeStyle = '#e4c275';
      nameCtx.lineWidth = 4;
      nameCtx.strokeRect(2, 2, 252, 60);

    function createFloatingText(text, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 512, 128);

      const colorStr = "#" + colorHex.toString(16).padStart(6, '0');

      ctx.font = 'bold 50px "Cinzel", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Neon glow settings
      ctx.shadowColor = colorStr;
      ctx.shadowBlur = 18;

      // Glowing border outline
      ctx.strokeStyle = colorStr;
      ctx.lineWidth = 6;
      ctx.strokeText(text.toUpperCase(), 256, 64);

      // High contrast crisp fill
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#fffdf0';
      ctx.fillText(text.toUpperCase(), 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        fog: false
      });

      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(5.5, 1.375, 1.0);
      return sprite;
    }

    function buildZones() {

        { key: 'profile', pos: [-25, 0] },
        { key: 'skills', pos: [-10, 0] },
        { key: 'experience', pos: [5, 0] },
        { key: 'projects', pos: [20, 0] },
        { key: 'education', pos: [35, 0] }
      ];
      defs.forEach(({ key, pos }) => {
        const d = ZONE_DATA[key];
        const g = new THREE.Group();

        const y = getTerrainHeight(pos[0], pos[1]);
        g.position.set(pos[0], y, pos[1]);

        // Base platform

          new THREE.CylinderGeometry(2.0, 2.2, 0.25, 12),
          new THREE.MeshStandardMaterial({ color: 0x1d211a, roughness: 0.95 })

        // Monolith Side Columns

        rightCol.position.set(0.95, 1.9, 0);

        // Monolith Lintel Top Stone
        const lintel = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.35, 0.45), stoneMat);

    // ─── Events ─────────────────────────────────────────────────────────────────
    function setupEvents() {
      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (k === 'w' || k === 'arrowup') keys.w = true;
        if (k === 'a' || k === 'arrowleft') keys.a = true;
        if (k === 's' || k === 'arrowdown') keys.s = true;
        if (k === 'd' || k === 'arrowright') keys.d = true;
        if (k === 'e') tryInteract();
        if (k === 'escape') closePanel();
        if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          keys.space = true;
        }
      });
      window.addEventListener('keyup', e => {
        const k = e.key.toLowerCase();
        if (k === 'w' || k === 'arrowup') keys.w = false;
        if (k === 'a' || k === 'arrowleft') keys.a = false;
        if (k === 's' || k === 'arrowdown') keys.s = false;
        if (k === 'd' || k === 'arrowright') keys.d = false;
        if (e.key === ' ' || e.code === 'Space') {
          keys.space = false;
        }
      });
      window.addEventListener('mousedown', e => { isDragging = true; lastMX = e.clientX; lastMY = e.clientY; });
      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('mousemove', e => {
        if (isDragging && !panelOpen) {
          camAngleH -= (e.clientX - lastMX) * 0.007;
          camAngleV += (e.clientY - lastMY) * 0.005; // vertical rotation
          camAngleV = Math.max(-0.35, Math.min(0.85, camAngleV)); // clamp pitch
          lastMX = e.clientX;
          lastMY = e.clientY;
        }
      });
      window.addEventListener('touchstart', e => { isDragging = true; lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('touchend', () => isDragging = false);
      window.addEventListener('touchmove', e => {
        if (isDragging && !panelOpen) {
          camAngleH -= (e.touches[0].clientX - lastMX) * 0.007;
          camAngleV += (e.touches[0].clientY - lastMY) * 0.005;
          camAngleV = Math.max(-0.35, Math.min(0.85, camAngleV));
          lastMX = e.touches[0].clientX;
          lastMY = e.touches[0].clientY;
        }
      }, { passive: true });
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    // ─── UI helpers ─────────────────────────────────────────────────────────────
    function showTooltip(txt) {
      const el = document.getElementById('tooltip');
      el.textContent = txt; el.classList.add('show');
      clearTimeout(tooltipTimer);
      tooltipTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
    function tryInteract() { if (nearZone) openPanel(nearZone); }
    function openPanel(zone) {
      panelOpen = true;
      document.getElementById('panel-content').innerHTML = zone.data.html;
      document.getElementById('panel').classList.add('open');
    }
    function closePanel() {
      panelOpen = false;
      document.getElementById('panel').classList.remove('open');
    }

    // ─── Loop ────────────────────────────────────────────────────────────────────
    let walkPhase = 0;
    const _v3 = new THREE.Vector3();
    const _camTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      // ── Jumping physics ──
      if (keys.space && !isJumping) {
        isJumping = true;
        velocityY = jumpForce;
        playChime(523.25); // Play C5 chime on jump
      }

      if (isJumping) {
        velocityY += gravity * dt;
        jumpOffset += velocityY * dt;
        if (jumpOffset <= 0) {
          jumpOffset = 0;
          isJumping = false;
          velocityY = 0;
          playChime(329.63); // Play E4 chime on landing
        }
      }

      // ── Movement ──
      const fwd = new THREE.Vector3(-Math.sin(camAngleH), 0, -Math.cos(camAngleH));
      const right = new THREE.Vector3(Math.cos(camAngleH), 0, -Math.sin(camAngleH));
      _v3.set(0, 0, 0);
      if (keys.w) _v3.addScaledVector(fwd, 1);
      if (keys.s) _v3.addScaledVector(fwd, -1);
      if (keys.a) _v3.addScaledVector(right, -1);
      if (keys.d) _v3.addScaledVector(right, 1);

      const moving = _v3.lengthSq() > 0;
      if (moving) {
        _v3.normalize().multiplyScalar(6.5 * dt);
        character.position.add(_v3);
        character.position.clamp(new THREE.Vector3(-55, -10, -28), new THREE.Vector3(55, 10, 28));
        character.rotation.y = Math.atan2(_v3.x, _v3.z);
        walkPhase += dt * 7.5;

        // Periodically play a very soft stepping chime or rustle
        if (Math.floor(walkPhase) % 8 === 0 && Math.random() < 0.08) {
          playChime(220 + Math.random() * 220);
        }
      } else {
        walkPhase = 0;
      }

      const terrainY = getTerrainHeight(character.position.x, character.position.z);
      const bobbing = !isJumping && moving ? Math.abs(Math.sin(walkPhase)) * 0.12 : 0;
      character.position.y = terrainY + jumpOffset + bobbing;

      // ── Advanced Character Animations ──
      const torso = character.getObjectByName('torso');
      const head = character.getObjectByName('head');
      const legL = character.getObjectByName('legL');
      const legR = character.getObjectByName('legR');
      const armL = character.getObjectByName('armL');
      const armR = character.getObjectByName('armR');
      const forearmL = character.getObjectByName('forearmL');
      const forearmR = character.getObjectByName('forearmR');
      const shinL = character.getObjectByName('shinL');
      const shinR = character.getObjectByName('shinR');

      if (isJumping) {
        // Dynamic mid-air jump pose (bended knees, flared elbows)
        if (legL) legL.rotation.x = -0.35;
        if (legR) legR.rotation.x = 0.35;
        if (armL) { armL.rotation.x = -0.6; armL.rotation.z = -0.45; }
        if (armR) { armR.rotation.x = -0.6; armR.rotation.z = 0.45; }
        if (forearmL) forearmL.rotation.x = -0.45;
        if (forearmR) forearmR.rotation.x = -0.45;
        if (shinL) shinL.rotation.x = 0.5;
        if (shinR) shinR.rotation.x = 0.5;
        if (torso) { torso.rotation.x = -0.06; torso.rotation.y = 0; torso.rotation.z = 0; }
        if (head) head.rotation.x = 0.08;
      } else {
        // Advanced natural walk cycle (swaying hips, bouncing shoulders, swinging arms, bending knees & elbows)
        const legRot = Math.sin(walkPhase) * (moving ? 0.48 : 0);
        const armRot = Math.sin(walkPhase) * (moving ? 0.38 : 0);

        if (legL) legL.rotation.x = legRot;
        if (legR) legR.rotation.x = -legRot;
        if (armL) {
          armL.rotation.x = -armRot;
          armL.rotation.z = -0.15 - Math.abs(Math.sin(walkPhase)) * 0.05 * (moving ? 1 : 0);
        }
        if (armR) {
          armR.rotation.x = armRot;
          armR.rotation.z = 0.15 + Math.abs(Math.sin(walkPhase)) * 0.05 * (moving ? 1 : 0);
        }

        // Elbow bending during swing
        if (forearmL) forearmL.rotation.x = moving ? -0.25 - Math.sin(walkPhase) * 0.15 : -0.15;
        if (forearmR) forearmR.rotation.x = moving ? -0.25 + Math.sin(walkPhase) * 0.15 : -0.15;

        // Knee bending (knee flexes when leg goes backwards)
        if (shinL) shinL.rotation.x = moving ? Math.max(0, -Math.sin(walkPhase) * 0.5) : 0.05;
        if (shinR) shinR.rotation.x = moving ? Math.max(0, Math.sin(walkPhase) * 0.5) : 0.05;

        // Hip and shoulder rotation
        if (torso) {
          torso.rotation.x = moving ? 0.08 : 0; // Forward lean
          torso.rotation.y = Math.sin(walkPhase) * 0.06 * (moving ? 1 : 0); // Hip swing
          torso.rotation.z = Math.cos(walkPhase * 2) * 0.02 * (moving ? 1 : 0); // Shoulder sway
        }
        if (head) {
          head.rotation.x = moving ? -0.03 : 0;
          head.rotation.y = Math.sin(walkPhase) * 0.03 * (moving ? 1 : 0);
        }
      }

      // ── Camera ──
      const radius = 9.5;
      const hDist = radius * Math.cos(camAngleV);
      const vDist = radius * Math.sin(camAngleV);

      _camTarget.set(
        character.position.x + Math.sin(camAngleH) * hDist,
        character.position.y + 1.3 + vDist,
        character.position.z + Math.cos(camAngleH) * hDist
      );
      camera.position.lerp(_camTarget, 0.095);
      camera.lookAt(character.position.x, character.position.y + 1.3, character.position.z);

      // ── Zone proximity & audio chime triggers ──
      let closest = null, closestDist = 5.5;
      zones.forEach(z => {
        const d = character.position.distanceTo(z.pos);
        if (d < closestDist) { closest = z; closestDist = d; }
      });

      const freqs = { profile: 329.63, skills: 392.00, experience: 440.00, projects: 523.25, education: 587.33 }; // E4, G4, A4, C5, D5
      if (closest !== nearZone) {
        nearZone = closest;
        document.getElementById('zone-name').textContent = nearZone ? nearZone.data.title : 'Explore the Portfolio';
        if (nearZone) {
          showTooltip('Press E to explore ' + nearZone.data.title);
          playChime(freqs[nearZone.key] || 440);
        }
      }

      // ── Zone animations ──
      zones.forEach((z, i) => {
        const orb = z.group.getObjectByName('orb');
        const ring = z.group.getObjectByName('ring');
        const isNear = z === nearZone;
        const bob = Math.sin(t * 1.5 + i * 1.2) * 0.15;
        if (orb) {
          orb.position.y = 2.0 + bob;
          orb.material.emissiveIntensity = isNear ? 1.4 : 0.6;
        }
        if (ring) {
          ring.position.y = 2.0 + bob;
          ring.rotation.z += dt * (isNear ? 2.5 : 0.8);
          ring.rotation.x += dt * 0.18;
        }
      });

      // ── Foliage swaying in the wind ──
      scene.traverse(child => {
        if (child.name === 'foliage') {
          child.rotation.x = Math.sin(t * 0.75 + child.parent.position.x) * 0.035;
          child.rotation.z = Math.cos(t * 0.6 + child.parent.position.z) * 0.025;
        }
      });

      // ── Spores/Pollen drift ──
      animateSpores(dt, t);

      // ── Environment animations ──
      scene.children.forEach(c => {
        if (c.userData.type === 'cloud') {
          c.position.x += c.userData.speed * dt;
          if (c.position.x > 90) c.position.x = -90;
        }
        if (c.userData.type === 'bird') {
          c.position.x += c.userData.speed * dt;
          c.position.y += Math.sin(t * 0.6 + c.position.z) * 0.008;
          if (c.position.x > 90) c.position.x = -90;
          const flap = Math.sin(t * 6 + c.userData.speed);
          const wL = c.getObjectByName('L'); const wR = c.getObjectByName('R');
          if (wL) wL.rotation.z = flap * 0.32;
          if (wR) wR.rotation.z = -flap * 0.32;
        }
        if (c.userData.type === 'firefly') {
          c.position.y = 1.4 + Math.sin(t * 1.3 + c.userData.off) * 0.55;
          c.position.x += Math.sin(t * 0.6 + c.userData.off) * 0.015;
          c.position.z += Math.cos(t * 0.4 + c.userData.off) * 0.015;
          c.intensity = 0.25 + Math.abs(Math.sin(t * 2.5 + c.userData.off)) * 0.6;
        }
      });

      // ── Space animations ──
      if (earthMesh) earthMesh.rotation.y += dt * 0.015;
      if (marsMesh) marsMesh.rotation.y += dt * 0.010;
      if (saturnGroup) saturnGroup.rotation.y += dt * 0.008;
      if (galaxyParticles) galaxyParticles.rotation.y += dt * 0.005;
      if (moonMesh && earthMesh) {
        const orbRad = 32;
        const speed = 0.08;
        moonMesh.position.x = earthMesh.position.x + Math.sin(t * speed) * orbRad;
        moonMesh.position.z = earthMesh.position.z + Math.cos(t * speed) * orbRad;
        moonMesh.rotation.y += dt * 0.02;
      }

      renderer.render(scene, camera);
    }
  </script>
